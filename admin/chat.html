<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APAH Agent Chat</title><link rel="stylesheet" href="/css/styles.css"></head><body><main class="section"><div class="container"><div class="section-head"><span class="kicker">Private agent console</span><h1>Visitor conversations</h1><p class="muted">This console requires the deployment's agent dashboard token. Do not publish or share the token.</p></div><div class="grid grid-2"><section class="card"><label class="field"><span>Dashboard token</span><input id="token" type="password" autocomplete="off"></label><label class="field"><span>Your agent ID</span><input id="agent" placeholder="Configured agent ID"></label><button id="connect" class="btn btn-primary" type="button">Connect</button><p id="status" class="muted" role="status"></p><div id="sessions" class="footer-links"></div></section><section class="card"><h2 id="session-title">Select a conversation</h2><div id="profile" class="notice"></div><div id="messages" style="min-height:280px;max-height:55vh;overflow:auto;margin:1rem 0"></div><form id="reply" class="form"><textarea id="text" required placeholder="Reply to visitor..."></textarea><button class="btn btn-primary" type="submit">Send reply</button></form></section></div></div></main><script>
let token='',agent='',selected='';const $=id=>document.getElementById(id);function headers(){return {'Content-Type':'application/json','Authorization':'Bearer '+token}}async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{...headers(),...(opts.headers||{})}});if(!r.ok)throw new Error((await r.json()).error||'Request failed');return r.json()}
$('connect').onclick=async()=>{token=$('token').value.trim();agent=$('agent').value.trim();if(!token||!agent)return $('status').textContent='Enter both values.';sessionStorage.setItem('apah-agent-token',token);sessionStorage.setItem('apah-agent-id',agent);await heartbeat();load();setInterval(heartbeat,20000);setInterval(load,5000);$('status').textContent='Connected.'};
async function heartbeat(){try{await api('/api/agent/heartbeat',{method:'POST',body:JSON.stringify({agentId:agent})})}catch(e){$('status').textContent=e.message}}
async function load(){try{const d=await api('/api/agent/sessions');$('sessions').innerHTML=d.sessions.map(s=>`<button class="btn btn-secondary" type="button" data-id="${s.id}">${s.profile.name||'Visitor'} — ${s.status}</button>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>select(b.dataset.id))}catch(e){$('status').textContent=e.message}}
async function select(id){selected=id;const d=await api('/api/agent/session?sessionId='+encodeURIComponent(id));const s=d.session;$('session-title').textContent='Conversation '+s.id.slice(0,8);$('profile').textContent=JSON.stringify(s.profile,null,2);$('messages').innerHTML=s.messages.map(m=>`<p><strong>${m.role}:</strong> ${String(m.text).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</p>`).join('');$('messages').scrollTop=$('messages').scrollHeight;if(s.status!=='agent')await api('/api/agent/claim',{method:'POST',body:JSON.stringify({sessionId:id,agentId:agent})})}
$('reply').onsubmit=async e=>{e.preventDefault();if(!selected)return;await api('/api/agent/message',{method:'POST',body:JSON.stringify({sessionId:selected,agentId:agent,text:$('text').value})});$('text').value='';await select(selected)};
$('token').value=sessionStorage.getItem('apah-agent-token')||'';$('agent').value=sessionStorage.getItem('apah-agent-id')||'';
</script></body></html>
